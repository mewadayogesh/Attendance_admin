{% extends 'base.html' %}
{% block title %}Add New User{% endblock %}
{% set active_page = 'add_user' %}

{% block extra_style %}
<style>
    /* Ensures proper alignment next to the fixed sidebar */
    .main-content-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        width: 100%;
        box-sizing: border-box;

    }

    /* Unified styling for inputs and selects */
    .form-panel input,
    .form-panel select {
        width: 100%;
        padding: 11px 14px;
        font-size: 15px;
        border: 2px solid #0e409c;
        border-radius: 4px;
        outline: none;
        background: white;
        box-sizing: border-box;
        
    }

    .form-panel input:focus,
    .form-panel select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Password container layout for eye icon button */
    .password-container {
        position: relative;
        display: flex;
        align-items: center;
    }

    .password-container input {
        padding-right: 45px;
    }

    .toggle-password-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6b7280;
    }

    .toggle-password-btn:hover {
        color: #2563eb;
    }

    .toggle-password-btn svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
    }
    .form-panel{
        margin-left:30%;
        border:3px solid #2e81ee;

    }
</style>
{% endblock %}

{% block content %}
<div class="main-content-wrapper">
    <div class="form-panel" style="width: 100%; max-width: 500px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        
        <h2 style="text-align: center; border-bottom: 4px solid #bfdbfe; padding-bottom: 8px;">Add New User</h2>

        
        <form method="POST" action="{{ url_for('add_user') }}">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" id="password-field" name="password" placeholder="Enter password" required>
                    <button type="button" id="togglePasswordBtn" class="toggle-password-btn" title="Show password">
                        <!-- Eye Icon (Show) -->
                        <svg id="eye-icon" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label>Role</label>
                <select name="role" required>
                    <option value="user">User</option>
                    <option value="editor">Editor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="input-group">
                <label>Link to Employee (for attendance)</label>
                <select name="linked_employee_id">
                    <option value="">— Not linked —</option>
                    {% for e in employees %}
                    <option value="{{ e['id'] }}">{{ e['name'] }} ({{ e['employee_id'] }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-save" style="width: 100%;">Create User</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const passwordField = document.getElementById("password-field");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    const eyeIcon = document.getElementById("eye-icon");

    togglePasswordBtn.addEventListener("click", function() {
        if (passwordField.type === "password") {
            passwordField.type = "text";
            // Switch to Eye-Off Icon
            eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>';
            togglePasswordBtn.setAttribute("title", "Hide password");
        } else {
            passwordField.type = "password";
            // Switch back to Eye Icon
            eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            togglePasswordBtn.setAttribute("title", "Show password");
        }
    });
</script>
{% endblock %}
